name: Preview Windows Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      focused_editor_checks:
        description: Run isolated save and ASS browser checks without packaging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-regression:
    name: Check Windows save and ASS regressions
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.focused_editor_checks }}
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Prepare isolated browser checks
        shell: pwsh
        run: |
          uv sync --frozen --group build --group test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip' -OutFile ffmpeg.zip -TimeoutSec 120
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec') { throw 'FFmpeg checksum mismatch' }
          Expand-Archive ffmpeg.zip ffmpeg-test
          $Binary = (Get-ChildItem ffmpeg-test -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          if (-not $Binary) { throw 'Missing FFmpeg binary' }
          $BinDir = Split-Path -Parent $Binary
          "MSW_E2E_PYTHON=$PWD/.venv/Scripts/python.exe" >> $env:GITHUB_ENV
          "MSW_E2E_FFMPEG=$Binary" >> $env:GITHUB_ENV
          "MSW_TEST_FFMPEG=$BinDir" >> $env:GITHUB_ENV
          "FFMPEG_PATH=$BinDir" >> $env:GITHUB_ENV
          $BinDir >> $env:GITHUB_PATH
      - name: Check save and ASS paths
        run: npx playwright test tests/e2e/save-background-efficiency.spec.mjs tests/e2e/project-subtitle-style.spec.mjs --project=chromium --repeat-each=2
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: focused-editor-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-windows:
    name: Build Windows x64 MSW-lite preview
    if: ${{ !inputs.focused_editor_checks }}
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify Launcher version
        run: python scripts/sync_launcher_version.py --check

      - name: Install locked dependencies
        run: uv sync --group build --frozen

      - name: Run packaging contract tests
        run: uv run python -m unittest tests/test_packaging_contract.py

      - name: Run Python tests
        env:
          PYTHONPATH: tests
        run: uv run python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Download embedded Python bootstrap assets
        run: |
          mkdir -p build
          curl -L --retry 3 --connect-timeout 20 --max-time 300 -o build/python-3.11.9-embed-amd64.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          curl -L --retry 3 --connect-timeout 20 --max-time 120 -o build/get-pip.py https://bootstrap.pypa.io/get-pip.py

      - name: Build MSW bundle
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipTests

      - name: Verify bundled FAQ
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'dist\MSW\FAQ-常见问题.txt' -PathType Leaf)) {
            throw 'Missing dist\MSW\FAQ-常见问题.txt after build.'
          }

      - name: Verify runtime requirements bundled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Required = @(
            '_internal\local-runtime\requirements-local.txt'
            '_internal\ocr-runtime\requirements-ocr.txt'
            '_internal\moss-runtime\requirements-moss.txt'
          )
          foreach ($Relative in $Required) {
            $Path = Join-Path 'dist\MSW' $Relative
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "Missing runtime requirements in bundle: $Path"
            }
          }

      - name: Smoke MSW executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ExePath = 'dist\MSW\MSW.exe'
          if (-not (Test-Path -LiteralPath $ExePath -PathType Leaf)) {
            throw 'Missing dist\MSW\MSW.exe after build.'
          }
          $HelpProcess = Start-Process -FilePath $ExePath -ArgumentList '--help' -PassThru -WindowStyle Hidden
          if ($HelpProcess.WaitForExit(10000)) {
            if ($HelpProcess.ExitCode -ne 0) {
              throw "MSW.exe launch smoke exited with $($HelpProcess.ExitCode)."
            }
          } else {
            Stop-Process -Id $HelpProcess.Id -Force
          }

      - name: Verify no FFmpeg is bundled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $BundledFfmpeg = Get-ChildItem -LiteralPath 'dist\MSW' -Recurse -File |
            Where-Object { $_.Name -in @('ffmpeg.exe', 'ffprobe.exe', 'ffplay.exe') }
          if ($BundledFfmpeg) {
            throw "The PR preview must not bundle FFmpeg: $($BundledFfmpeg.FullName -join ', ')"
          }

      - name: Create MSW-lite release preview archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PrNumber = '${{ github.event.pull_request.number || 'manual' }}'
          $BuildSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          $Archive = "MSW-lite-Windows-x64-pr-$PrNumber-$BuildSha.zip"
          Compress-Archive -LiteralPath 'dist\MSW' -DestinationPath $Archive -Force

      - name: Upload MSW-lite release preview
        uses: actions/upload-artifact@v6
        with:
          name: MSW-lite-Windows-x64-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            MSW-lite-Windows-x64-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
