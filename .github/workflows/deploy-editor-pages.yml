name: Deploy MSW website to GitHub Pages

on:
  push:
    branches: [my-feature]
    paths:
      - "website/**"
      - "README.md"
      - "JSON_SCHEMA.md"
      - "docs/**"
      - "edit.py"
      - "web/**"
      - "maw/reapeaks.py"
      - "maw/quapeaks.py"
      - "maw/mopeaks.py"
      - "maw/**"
      - ".github/workflows/deploy-editor-pages.yml"
  workflow_dispatch:

concurrency:
  group: editor-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install locked Python dependencies
        run: uv sync --frozen --no-group build --no-dev

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Sync MSW documentation
        working-directory: website
        run: npm run sync:docs

      - name: Build website
        working-directory: website
        env:
          SITE_URL: https://xiaoyaomoyor.github.io/moyors-subtitle-workflow
          BASE_PATH: /moyors-subtitle-workflow
        run: npm run build

      - name: Add portable editor page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/dist/editor/web
          uv run --no-sync python -c "from pathlib import Path; import edit; Path('website/dist/editor/index.html').write_bytes(edit.build_blank_html().encode('utf-8'))"
          cp -r web/sfx website/dist/editor/web/sfx
          touch website/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
